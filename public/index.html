<script type="text/javascript">
// Vanilla slideUp
function slideUp(element, duration = 500) {
  element.style.height = element.offsetHeight + 'px';
  element.offsetHeight; // Force reflow
  element.style.transitionProperty = 'height, margin, padding';
  element.style.transitionDuration = duration + 'ms';
  element.style.boxSizing = 'border-box';
  element.style.height = '0';
  element.style.paddingTop = '0';
  element.style.paddingBottom = '0';
  element.style.marginTop = '0';
  element.style.marginBottom = '0';
  element.style.overflow = 'hidden';
  setTimeout(() => {
    element.style.display = 'none';
    element.style.removeProperty('height');
    element.style.removeProperty('padding-top');
    element.style.removeProperty('padding-bottom');
    element.style.removeProperty('margin-top');
    element.style.removeProperty('margin-bottom');
    element.style.removeProperty('overflow');
    element.style.removeProperty('transition-duration');
    element.style.removeProperty('transition-property');
  }, duration);
}

// Vanilla slideDown
function slideDown(element, duration = 500) {
  let originalDisplay = window.getComputedStyle(element).display;
  if (originalDisplay === 'none') {
    originalDisplay = 'block'; // Default to block if it was none
  }
  element.style.display = originalDisplay;
  let fullHeight = element.offsetHeight;
  element.style.height = '0';
  element.style.paddingTop = '0';
  element.style.paddingBottom = '0';
  element.style.marginTop = '0';
  element.style.marginBottom = '0';
  element.style.overflow = 'hidden';
  element.offsetHeight; // Force reflow
  element.style.transitionProperty = 'height, margin, padding';
  element.style.transitionDuration = duration + 'ms';
  element.style.boxSizing = 'border-box';
  element.style.height = fullHeight + 'px';
  setTimeout(() => {
    element.style.removeProperty('height');
    element.style.removeProperty('overflow');
    element.style.removeProperty('transition-duration');
    element.style.removeProperty('transition-property');
    element.style.removeProperty('padding-top');
    element.style.removeProperty('padding-bottom');
    element.style.removeProperty('margin-top');
    element.style.removeProperty('margin-bottom');
  }, duration);
}

// Cookie functions
function setCookie(name, value, days) {
  let expires = "";
  if (days) {
    const date = new Date();
    date.setTime(date.getTime() + (days*24*60*60*1000));
    expires = "; expires=" + date.toUTCString();
  }
  document.cookie = name + "=" + (value || "")  + expires + "; path=/";
}

function getCookie(name) {
  const nameEQ = name + "=";
  const ca = document.cookie.split(';');
  for(let i=0;i < ca.length;i++) {
    let c = ca[i];
    while (c.charAt(0)==' ') c = c.substring(1,c.length);
    if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
  }
  return null;
}

document.addEventListener('DOMContentLoaded', function() {
  // デザイン関連
  // モバイルとタブレットとPCとで文字サイズ変更
  var agent = navigator.userAgent;
  if(agent.search(/iPhone/) != -1 || agent.search(/iPod/) != -1 || agent.search(/Android/) != -1){
    document.querySelectorAll('.btn').forEach(function(btn) {
      btn.style.fontSize = "8px";
    });
    const selectedWeaponInfo = document.getElementById('selected_weapon_information');
    if (selectedWeaponInfo) {
      selectedWeaponInfo.style.fontSize = "8px";
    }
  }

  // ボタン選択状態設定
  document.querySelectorAll('.btn').forEach(function(btn) {
    btn.addEventListener('click', function () {
      var val = this.value;
      var id  = this.id;
      if ((id == "select") || id.match(/all-/) || id.match(/declear-/) || (val == -1) || (id == "save") || (id == "load")) {
          return false;
      } else if (val == 1) {
        this.value = 0;
        this.classList.remove("btn-success");
        this.classList.add("btn-default");
      } else {
        this.value = 1;
        this.classList.remove("btn-default");
        this.classList.add("btn-success");
      }
    });
  });

  // 選定武器表示
  const selectButton = document.getElementById('select');
  if (selectButton) {
    selectButton.addEventListener('click', function () {
      var label = "";
      var selectedWeapons = Array.from(document.querySelectorAll('button[value="1"]')).map(function(button) {
        return button.dataset.contents;
      });

      const selectedWeaponInfo = document.getElementById('selected_weapon_information');
      const selectBtnText = document.getElementById('select');

      if (selectedWeapons.length == 0) {
        if (selectedWeaponInfo) slideUp(selectedWeaponInfo);
        if (selectBtnText) selectBtnText.textContent = "1つ以上選択してください";
        label = "未選択";
      }
      else if (selectedWeapons.length == 1) {
        var weapons = selectedWeapons[0].split("/");
        const mainWeaponEl = document.getElementById('selected_main_weapon');
        const subWeaponEl = document.getElementById('selected_sub_weapon');
        const specialWeaponEl = document.getElementById('selected_special_weapon');

        if (mainWeaponEl) mainWeaponEl.textContent = weapons[0];
        if (subWeaponEl) subWeaponEl.textContent = weapons[1];
        if (specialWeaponEl) specialWeaponEl.textContent = weapons[2];
        if (selectBtnText) selectBtnText.textContent = "選択";
        if (selectedWeaponInfo) slideDown(selectedWeaponInfo);
        label = weapons[0];
      } 
      else {
        selectedWeapons = shuffle(selectedWeapons);
        var datetime = +new Date();
        var weapons = selectedWeapons[(datetime%selectedWeapons.length)].split("/");
        const mainWeaponEl = document.getElementById('selected_main_weapon');
        const subWeaponEl = document.getElementById('selected_sub_weapon');
        const specialWeaponEl = document.getElementById('selected_special_weapon');

        if (mainWeaponEl) mainWeaponEl.textContent = weapons[0];
        if (subWeaponEl) subWeaponEl.textContent = weapons[1];
        if (specialWeaponEl) specialWeaponEl.textContent = weapons[2];
        if (selectBtnText) selectBtnText.textContent = "選択";
        if (selectedWeaponInfo) slideDown(selectedWeaponInfo);
        label = weapons[0];
      }
    });
  }

  // 混ぜるぜぇ～超混ぜるぜぇ～
  function shuffle(array) {
    var n = array.length, t, i;
    while (n) {
      i = Math.floor(Math.random() * n--);
      t = array[n];
      array[n] = array[i];
      array[i] = t;
    }
    return array;
  }

  // 全選択・解除
  function setupAllDeclareButtons(prefix) {
    const allButton = document.getElementById('all-' + prefix);
    const declearButton = document.getElementById('declear-' + prefix);

    if (allButton) {
      allButton.addEventListener('click', function() {
        document.querySelectorAll('[id^=' + prefix + '-]').forEach(function(btn) {
          if (btn.id.startsWith(prefix + "-") && btn.type === 'button' && !btn.id.startsWith('all-') && !btn.id.startsWith('declear-')) {
            btn.value = 1;
            btn.classList.remove("btn-default");
            btn.classList.add("btn-success");
          }
        });
      });
    }

    if (declearButton) {
      declearButton.addEventListener('click', function() {
        document.querySelectorAll('[id^=' + prefix + '-]').forEach(function(btn) {
           if (btn.id.startsWith(prefix + "-") && btn.type === 'button' && !btn.id.startsWith('all-') && !btn.id.startsWith('declear-')) {
            btn.value = 0;
            btn.classList.remove("btn-success");
            btn.classList.add("btn-default");
          }
        });
      });
    }
  }

  ['s', 'b', 'm', 'r', 'h', 'c', 't', 'sp', 'sh', 'amibo', 'o'].forEach(setupAllDeclareButtons);


  // 説明表示
  function setupToggleDisplay(titleId, contentId, iconId) {
    const titleElement = document.getElementById(titleId);
    const contentElement = document.getElementById(contentId);
    const iconElement = document.getElementById(iconId);

    if (titleElement && contentElement && iconElement) {
      titleElement.addEventListener('click', function() {
        var isHidden = window.getComputedStyle(contentElement).display === 'none' || contentElement.offsetHeight === 0;
        if (isHidden) {
            slideDown(contentElement);
            iconElement.classList.remove("glyphicon-triangle-bottom");
            iconElement.classList.add("glyphicon-triangle-top");
        } else {
            slideUp(contentElement);
            iconElement.classList.remove("glyphicon-triangle-top");
            iconElement.classList.add("glyphicon-triangle-bottom");
        }
      });
    }
  }

  setupToggleDisplay('first-title', 'first-contents', 'first-icon');
  setupToggleDisplay('howto-title', 'howto-contents', 'howto-icon');
  setupToggleDisplay('set-title', 'set-contents', 'set-icon');
  setupToggleDisplay('note-title', 'note-contents', 'note-icon');
  setupToggleDisplay('history-title', 'history-contents', 'history-icon');
  setupToggleDisplay('update-title', 'update-contents', 'update-icon');

  // 保存機能
  const saveButton = document.getElementById('save');
  if (saveButton) {
    saveButton.addEventListener('click', function () {
      var selectedWeapons = Array.from(document.querySelectorAll('button[value="1"]')).map(function(button) {
        return button.id;
      });
      if (selectedWeapons.length == 0) {
        alert("ウェポンを1つ以上選択してください。");
        return;
      }
      var selecetdWeaponsStr = selectedWeapons.join();
      setCookie("WhbWeaponRandomSelector2", selecetdWeaponsStr, 7);
      alert("選択したウェポンを保存しました。");
    });
  }

  // 参照機能
  const loadButton = document.getElementById('load');
  if (loadButton) {
    loadButton.addEventListener('click', function () {
      var savedWeaponsStr = getCookie("WhbWeaponRandomSelector2");
      if(savedWeaponsStr === null || savedWeaponsStr === "") {
        alert("ウェポンセットが保存されていません。");
        return;
      }
      var savedWeapons = savedWeaponsStr.split(",");
      
      // Clear all existing selections first by simulating "declear" clicks
      // This is a simplified approach; direct manipulation might be more robust
      // but this tries to follow the original logic of triggering declear buttons.
      document.querySelectorAll('button[id^="declear-"]').forEach(button => {
        if (typeof button.onclick === 'function') {
          button.onclick(); // Call existing onclick if it's set
        } else {
          // Fallback if onclick isn't directly set (e.g. event listener)
          // This part would ideally replicate the logic within those listeners
          const prefix = button.id.replace('declear-', '');
          document.querySelectorAll('[id^=' + prefix + '-]').forEach(function(btn) {
            if (btn.id.startsWith(prefix + "-") && btn.type === 'button' && !btn.id.startsWith('all-') && !btn.id.startsWith('declear-')) {
              btn.value = 0;
              btn.classList.remove("btn-success");
              btn.classList.add("btn-default");
            }
          });
        }
      });
            
      // Clear all existing selections (alternative, more direct way)
      document.querySelectorAll('button[type="button"]').forEach(function(btn) {
        if (btn.value === "1" && btn.dataset.contents && !btn.id.match(/all-|declear-|select|save|load/)) { // ensure it's a weapon button
            btn.value = 0;
            btn.classList.remove("btn-success");
            btn.classList.add("btn-default");
        }
      });
      
      savedWeapons.forEach(function(weaponId) {
        const weaponButton = document.getElementById(weaponId);
        if(weaponButton){
          weaponButton.value = 1;
          weaponButton.classList.remove("btn-default");
          weaponButton.classList.add("btn-success");
        }
      });
      
      alert("ウェポンセットを読み込みました。");
    });
  }
});
</script>
